name: Deploy Open Motion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare canonical-site redirect artifact
        shell: bash
        run: |
          mkdir -p _site
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="utf-8">
              <meta name="robots" content="noindex">
              <meta http-equiv="refresh" content="0;url=https://open-motion-api.we3q.workers.dev/">
              <title>Open Motion 正在跳转</title>
            </head>
            <body>
              <p>Open Motion 正在跳转到正式入口。</p>
              <p><a href="https://open-motion-api.we3q.workers.dev/">打开 Open Motion</a></p>
              <script>
                const canonical = 'https://open-motion-api.we3q.workers.dev';
                const targetPath = location.pathname.endsWith('/submit.html') ? '/submit.html' : '/';
                const target = new URL(targetPath, canonical);
                target.search = location.search;
                target.hash = location.hash;
                location.replace(target.href);
              </script>
            </body>
          </html>
          EOF
          cp _site/index.html _site/submit.html
          cp _site/index.html _site/404.html
      - name: Upload redirect artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
